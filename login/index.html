<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Giriş Yap</title>
</head>
<body>
    
    <div class="register">
        <h4>Henüz bir hesabın yokmu ?</h4>
        <h5>Bize katılmaya ne dersin ?</h5>
        <h6>Hadi hemen kayıt ol!</h6>

        <button type="submit" class="register-btn">Kayıt Ol</button>
    </div>

    <div class="login">
        <h1>Giriş Yap <i class="fa-solid fa-right-to-bracket"></i></h1>

        
        <input type="text" placeholder="E-Mail..">
        <input type="password" placeholder="Şifre..">

        <button type="submit" class="giris">Giriş Yap <i class="fa-solid fa-right-to-bracket"></i></button>
        <button type="submit" class="login-git"><i class="fa-brands fa-github fa-xl"></i> Git Hub İle Giriş Yap </button>
        <button type="submit" class="login-face"><i class="fa-brands fa-facebook fa-xl"></i> Facebook İle Giriş Yap </button>
        <button type="submit" class="forg-pass">Şifremi Unuttum..</button>
        

    </div>

</body>
</html>
